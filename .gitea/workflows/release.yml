name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim-amd64

    env:
      GITEA_CLI_REPO: ${{ gitea.repository }}
      GITEA_TOKEN: ${{ gitea.token }}
      TAG: ${{ gitea.ref_name }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create draft release
        run: |
          gt release view "$TAG" >/dev/null ||
            gt release create "$TAG" --draft --verify-tag

      - name: Upload assets
        run: |
          gt release upload "$TAG" main.js manifest.json --clobber
